<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Hồ sơ người dùng</title>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .profile-box {
            background: #fff;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .title {
            font-size: 28px;
            color: #e91e63;
            margin-bottom: 20px;
            font-family: 'Brush Script MT', cursive;
        }

        .info-item {
            margin-bottom: 14px;
            padding: 12px 16px;
            background: #f9fafc;
            border-radius: 10px;
            border-left: 4px solid #2b8aef;
        }

        .info-item strong {
            color: #2b8aef;
            font-size: 15px;
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 14px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
        }

        .btn-back {
            background: #ff9800;
            color: #fff;
        }

        .btn-edit {
            background: #2b8aef;
            color: #fff;
        }

        .btn-logout {
            background: #f44336;
            color: #fff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="profile-box">

        <h2 class="title">Hồ sơ người dùng</h2>

        <div class="info-item">
            <strong>Họ tên:</strong>
            <span th:text="${user.hoten}"></span>
        </div>

        <div class="info-item">
            <strong>Tên đăng nhập:</strong>
            <span th:text="${user.tendangnhap}"></span>
        </div>

        <div class="info-item">
            <strong>Email:</strong>
            <span th:text="${user.email}"></span>
        </div>

        <div class="info-item">
            <strong>Số điện thoại:</strong>
            <span th:text="${user.sdt}"></span>
        </div>

        <div class="info-item">
            <strong>Địa chỉ:</strong>
            <span th:text="${user.diachi}"></span>
        </div>

        <div class="actions">
            <a href="/home" class="btn btn-back">⬅ Quay lại</a>
            <a href="/edit-profile" class="btn btn-edit">✏ Chỉnh sửa</a>
            <a href="/logout" class="btn btn-logout">🚪 Đăng xuất</a>
        </div>

    </div>

</div>

</body>
</html>
