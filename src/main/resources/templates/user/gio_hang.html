<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Giỏ Hàng — Shop Hoa Tươi Fam's</title>
    <style>
        :root {
            --primary-color: #2b8aef;
            --danger-color: #f44336;
            --muted-bg: #f4f6fb;
            --card-bg: #ffffff;
            --text-color: #1b2430;
            --border-color: #e6eef8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Poppins', Arial, sans-serif;
            color: var(--text-color);
            background: var(--muted-bg);
        }

        /* Header */
        header {
            background: var(--card-bg);
            padding: 20px 24px;
            box-shadow: 0 2px 8px rgba(20,30,40,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .logo {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            display: grid;
            place-items: center;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 22px;
            margin: 0;
        }

        .muted {
            font-size: 12px;
            color: #555;
        }

        nav a {
            margin-left: 18px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .login-register a {
            margin-left: 16px;
            padding: 6px 12px;
            background: var(--primary-color);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        /* Main container */
        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 18px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        /* Table giỏ hàng */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(40,60,80,0.06);
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .quantity-control button {
            padding: 4px 10px;
            border: 1px solid var(--border-color);
            background: var(--primary-color);
            color: #fff;
            cursor: pointer;
            border-radius: 4px;
        }
        .quantity-control span {
            display: inline-block;
            width: 30px;
            text-align: center;
            font-weight: 600;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: var(--muted-bg);
            font-weight: 600;
        }

        .price {
            color: var(--primary-color);
            font-weight: 600;
        }

        .qty {
            width: 60px;
            text-align: center;
        }

        .btn {
            padding: 8px 16px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-remove {
            background: var(--danger-color);
            margin-left: 8px;
        }

        /* Tổng cộng */
        .total {
            text-align: right;
            font-size: 20px;
            font-weight: 600;
            margin-top: 12px;
        }

        /* Hành động */
        .action-buttons {
            margin-top: 20px;
        }

        .action-buttons .btn {
            margin-right: 10px;
        }

        .btn-continue {
            background: #fff;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-checkout {
            background: var(--primary-color);
            color: #fff;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            color: #556;
        }
    </style>
</head>
<body>
<header>
    <div class="brand">
        <div class="logo">
            <img src="https://i.pinimg.com/736x/82/c8/6c/82c86cb1dac68fd24db24760e80490e7.jpg" alt="Logo Shop Hoa Tươi">
        </div>
        <div>
            <h1>Shop Hoa Tươi Fam's</h1>
            <div class="muted">Tươi mỗi ngày — Giao tận nơi</div>
        </div>
    </div>
    <nav>
        <a href="/home">Trang chủ</a>
        <a href="/products">Sản phẩm</a>
        <a href="/about">Về chúng tôi</a>
    </nav>
</header>

<main class="container">
    <h2>Giỏ Hàng Của Bạn</h2>
    <table id="cart-table">
        <thead>
        <tr>
            <th>Sản phẩm</th>
            <th>Đơn giá</th>
            <th>Số lượng</th>
            <th>Tổng</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody id="cart-body">
        </tbody>
    </table>
    <div class="total">Tổng cộng: <span id="total-amount">0</span> đ</div>
    <div class="action-buttons">
        <a href="/products" class="btn btn-continue">Tiếp tục mua hàng</a>
        <a href="/checkout" class="btn btn-checkout">Tiến hành thanh toán</a>
    </div>
</main>

<footer>
    &copy; 2025 Shop Hoa Tươi Fam's. Bản quyền thuộc về Shop Hoa Tươi Fam's.
</footer>


<script>
    function formatVND(number) {
        return (typeof number === 'number' ? number : 0).toLocaleString('vi-VN', { minimumFractionDigits: 0 });
    }

    function loadCart() {
        document.getElementById("cart-body").innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px;">Đang tải giỏ hàng...</td></tr>';

        fetch("/api/gio-hang")
            .then(res => res.json())
            .then(data => {
                let html = "";
                let total = 0;
                if (!data || data.length === 0) {
                    html = `<tr><td colspan="5" class="empty-cart-message">Giỏ hàng trống</td></tr>`;
                } else {
                    data.forEach(item => {
                        let subtotal = (item.sanPham.price || 0) * (item.soluong || 0);
                        total += subtotal;

                        html += `
                        <tr>
                            <td class="col-sanpham"><span class="product-name">${item.sanPham.name}</span></td>
                            <td class="col-dongia" style="text-align:right;"><span class="price-text">${formatVND(item.sanPham.price)} đ</span></td>
                            <td class="col-soluong">
                                <div class="quantity-control">
                                    <button onclick="updateQty(${item.sanPham.id}, ${item.soluong-1})">-</button>
                                    <span style="font-weight:600;">${item.soluong}</span>
                                    <button onclick="updateQty(${item.sanPham.id}, ${item.soluong+1})">+</button>
                                </div>
                            </td>
                            <td class="col-tong" style="text-align:right;">${formatVND(subtotal)} đ</td>
                            <td class="col-hanhdong">
                                <button class="remove-btn" onclick="updateQty(${item.sanPham.id}, 0)">Xóa</button>
                            </td>
                        </tr>
                    `;
                    });
                }
                document.getElementById("cart-body").innerHTML = html;
                document.getElementById("total-amount").innerText = formatVND(total);
            }).catch(err => {
            console.error(err);
            document.getElementById("cart-body").innerHTML = '<tr><td colspan="5" class="empty-cart-message" style="color: var(--danger-color);">Lỗi khi tải giỏ hàng.</td></tr>';
        });
    }

    function updateQty(spId, qty) {
        if (qty < 0) qty = 0;
        fetch("/api/gio-hang/update", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `sanPhamId=${spId}&soLuong=${qty}`
        }).then(res => {
            if (!res.ok) { alert("Cập nhật thất bại!"); loadCart(); return; }
            loadCart();
        }).catch(err => { console.error(err); alert("Lỗi kết nối"); loadCart(); });
    }

    loadCart();
</script>
</body>
</html>
