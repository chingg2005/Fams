<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán thành công — Shop Hoa Tươi Fam's</title>
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 0;
            color: #1b2430;
        }
        .container {
            max-width: 900px;
            margin: 60px auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(40,60,80,0.08);
        }
        h1 {
            color: #2b8aef;
            text-align: center;
            margin-bottom: 20px;
        }
        .order-info {
            margin: 20px 0;
            font-size: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #e6eef8;
            text-align: left;
        }
        th {
            background: #f4f6fb;
            font-weight: 600;
        }
        .price {
            color: #2b8aef;
            font-weight: 600;
            text-align: right;
        }
        .total {
            text-align: right;
            font-size: 20px;
            font-weight: 600;
            margin-top: 12px;
        }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: #2b8aef;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
        .btn:hover {
            background: #1a6fd1;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎉 Thanh toán thành công!</h1>
    <p style="text-align:center;">Cảm ơn bạn đã mua hàng tại <strong>Shop Hoa Tươi Fam's</strong>.</p>

    <!-- Thông tin đơn hàng -->
    <div class="order-info">
        <p>Mã đơn hàng: <strong th:text="${order.id}"></strong></p>
        <p>Ngày đặt: <span th:text="${order.ngayDat}"></span></p>
        <p>Trạng thái: <span th:text="${order.trangThai}"></span></p>
    </div>

    <!-- Danh sách sản phẩm -->
    <h2>Chi tiết đơn hàng</h2>
    <table>
        <thead>
        <tr>
            <th>Sản phẩm</th>
            <th>Đơn giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ct : ${order.chiTiet}">
            <td th:text="${ct.sanPham.name}"></td>
            <td class="price" th:text="${ct.sanPham.price} + ' đ'"></td>
            <td th:text="${ct.soLuong}"></td>
            <td class="price" th:text="${ct.sanPham.price * ct.soLuong} + ' đ'"></td>
        </tr>

        </tbody>
    </table>

    <!-- Tổng cộng -->
    <div class="total">
        Tổng cộng: <span th:text="${order.tongTien}"></span> đ
    </div>

    <!-- Nút quay lại -->
    <div style="text-align:center;">
        <a href="/products" class="btn">Tiếp tục mua hàng</a>
    </div>
</div>
</body>
</html>
